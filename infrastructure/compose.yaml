name: moodle-enrollment-manager
x-backend: &backend
  image: moodle-enrollment-manager-api
  build: ../backend
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enrollment}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enrollment}
    REDIS_URL: redis://redis:6379/0
    CSV_MAX_BYTES: ${CSV_MAX_BYTES:-10485760}
    CSV_MAX_ROWS: ${CSV_MAX_ROWS:-50000}
    CSV_MAX_OPERATIONS: ${CSV_MAX_OPERATIONS:-100000}
    VALIDATION_MAX_PAGES: ${VALIDATION_MAX_PAGES:-50}
    MOODLE_TOKEN_KEYS: ${MOODLE_TOKEN_KEYS:?Inicializar clave con scripts/init-secrets.py}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
    LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-30}
    LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-10}
    LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enrollment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enrollment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 8s
      retries: 10
  worker:
    <<: *backend
    command: [celery, -A, app.workers.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=1, --queues=validation]
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.workers.celery_app:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5']
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
  maintenance:
    <<: *backend
    command: [celery, -A, app.workers.celery_app:celery_app, worker, --loglevel=INFO, --pool=solo, --concurrency=1, --queues=maintenance]
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.workers.celery_app:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5']
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
  beat:
    <<: *backend
    command: [celery, -A, app.workers.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  redis_data:
