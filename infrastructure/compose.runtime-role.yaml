# Add after compose.yaml (and compose.production.yaml for HTTPS).
# Explicitly require a provisioned runtime identity; never fall back to the migration owner.
x-runtime-env: &runtime-env
  DATABASE_URL: ${RUNTIME_DATABASE_URL:?Crear rol y configurar RUNTIME_DATABASE_URL por canal seguro}
x-after-permissions: &after-permissions
  db-permissions:
    condition: service_completed_successfully
services:
  db-permissions:
    image: moodle-enrollment-manager-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enrollment}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enrollment}
      REDIS_URL: redis://redis:6379/0
      RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL:?Configurar credencial de runtime}
    command: [python, -m, app.cli, grant-runtime-role, --role, '${RUNTIME_DB_USER:-mem_runtime}', --check-runtime-url]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
  api:
    environment: *runtime-env
    depends_on: *after-permissions
  worker:
    environment: *runtime-env
    depends_on: *after-permissions
  enrollment-worker:
    environment: *runtime-env
    depends_on: *after-permissions
  maintenance:
    environment: *runtime-env
    depends_on: *after-permissions
  beat:
    environment: *runtime-env
    depends_on: *after-permissions
