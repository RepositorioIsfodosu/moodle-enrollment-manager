[project]
name = "moodle-enrollment-manager"
version = "0.8.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "celery>=5.4,<6",
    "httpx>=0.28,<1",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "cryptography>=50,<51",
    "dnspython>=2.6,<3",
    "openpyxl>=3.1,<4",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
